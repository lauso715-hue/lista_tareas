<h1>Mis Tareas</h1>
<a href="{% url 'crear_tarea' %}">Nueva Tarea</a>

<ul>
    {% for tarea in tareas %}
        <li>
            {{ tarea.titulo }} 
            - Estado: {{ tarea.get_estado_display }}
            - <a href="{% url 'editar_tarea' tarea.id %}">Editar</a>
            - <a href="{% url 'eliminar_tarea' tarea.id %}">Eliminar</a>
        </li>
    {% empty %}
        <li>No hay tareas todavía.</li>
    {% endfor %}
</ul>
